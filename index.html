<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Görsel Sanatlar Bilgi Yarışması</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="game">

    <!-- AÇILIŞ EKRANI -->
    <section id="startScreen" class="screen active">
      <img class="start-bg" src="images/giris-ekrani.png" alt="Görsel Sanatlar Bilgi Yarışması">

      <!-- Görseldeki yeşil BAŞLA butonunun üstüne oturan gerçek buton -->
      <button id="startButton" class="start-button" aria-label="Başla">
        BAŞLA
      </button>
    </section>

    <!-- 50 SORULUK EKRAN -->
    <section id="questionBoard" class="screen">
      <div class="board-shell">
        <header class="board-header">
          <div class="mini-palette">🎨</div>
          <div>
            <h1>GÖRSEL SANATLAR</h1>
            <h2>BİLGİ YARIŞMASI</h2>
          </div>
          <div class="mini-palette">🖌️</div>
        </header>

        <div class="board-title">SORUNU SEÇ</div>

        <div id="questionGrid" class="question-grid"></div>

        <button id="backButton" class="back-button">← GERİ DÖN</button>
      </div>
    </section>

  </main>

  <script src="game.js"></script>
</body>
</html>
