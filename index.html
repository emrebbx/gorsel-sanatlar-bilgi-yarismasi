<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Görsel Sanatlar Bilgi Yarışması</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="game">

    <!-- GİRİŞ -->
    <section id="startScreen" class="screen active">
      <img
        class="start-bg"
        src="images/giris-arkaplan.png"
        alt="Görsel Sanatlar Bilgi Yarışması"
      >

      <button id="startButton" class="start-button" aria-label="Başla">
        <img src="images/basla.png" alt="Başla">
      </button>
    </section>

    <!-- 50 SORU EKRANI - ŞİMDİLİK GEÇİCİ -->
    <section id="questionBoard" class="screen">
      <div class="board">
        <h1>SORUNU SEÇ</h1>
        <div id="questionGrid" class="question-grid"></div>
        <button id="backButton" class="back-button">← GERİ</button>
      </div>
    </section>

  </main>

  <script src="game.js"></script>
</body>
</html>
