<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Görsel Sanatlar Bilgi Yarışması</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="game">


    <!-- =========================
         GİRİŞ EKRANI
    ========================== -->

    <section id="startScreen" class="screen active">

      <img
        class="start-bg"
        src="images/giris-arkaplan.webp"
        alt="Görsel Sanatlar Bilgi Yarışması"
      >

      <button
        id="startButton"
        class="start-button"
        aria-label="Başla"
      >
        <img
          src="images/basla.png"
          alt="Başla"
        >
      </button>

    </section>



    <!-- =========================
         50 SORU EKRANI
    ========================== -->

    <section id="questionBoard" class="screen">


      <!-- KIRMIZI TAKIM SKORU -->

      <div class="score-box red-score-box">

        <img
          src="images/kirmizi-skor.png"
          alt="Kırmızı Takım"
        >

        <span class="score-number red-score-number red-score-value">
          0
        </span>

      </div>



      <!-- MAVİ TAKIM SKORU -->

      <div class="score-box blue-score-box">

        <img
          src="images/mavi-skor.png"
          alt="Mavi Takım"
        >

        <span class="score-number blue-score-number blue-score-value">
          0
        </span>

      </div>



      <!-- SORU SEÇİM PANOSU -->

      <div class="board">

        <h1>SORUNU SEÇ</h1>

        <div
          id="questionGrid"
          class="question-grid"
        ></div>


        <button
          id="backButton"
          class="back-button"
        >
          ← GERİ
        </button>

      </div>

    </section>



    <!-- =========================
         SORU 1 EKRANI
    ========================== -->

    <section id="questionScreen" class="screen">


      <!-- SORU ARKA PLANI -->

      <img
        class="question-bg"
        src="images/soru-1-arkaplan.webp"
        alt="Soru 1"
      >


      <!-- KIRMIZI TAKIM SKORU -->

      <div class="score-box red-score-box">

        <img
          src="images/kirmizi-skor.png"
          alt="Kırmızı Takım"
        >

        <span class="score-number red-score-number red-score-value">
          0
        </span>

      </div>



      <!-- MAVİ TAKIM SKORU -->

      <div class="score-box blue-score-box">

        <img
          src="images/mavi-skor.png"
          alt="Mavi Takım"
        >

        <span class="score-number blue-score-number blue-score-value">
          0
        </span>

      </div>


      <!-- ŞİMDİLİK TEST İÇİN GERİ -->

      <button
        id="questionBackButton"
        class="question-back-button"
      >
        ← GERİ
      </button>


    </section>


  </main>


  <script src="game.js"></script>

</body>
</html>
